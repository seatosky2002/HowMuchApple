services:
  mysql:
    image: mysql:8.4
    container_name: howmuch-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: howmuch
      MYSQL_USER: howmuch
      MYSQL_PASSWORD: howmuch
      MYSQL_ROOT_PASSWORD: howmuch-root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # NOW() 기본값이 UTC로 저장되게 한다. TZ=Asia/Seoul 때문에 KST로 저장돼
      # 앱이 쓰는 UTC 값과 9시간 어긋났다(session.py의 SET time_zone과 동일 목적).
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uhowmuch -phowmuch --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
